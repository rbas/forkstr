version = 1

[[stages]]
name = "checks"

# Formatting does not compile, so it can run alongside the first Cargo build.
[[stages.commands]]
name = "format"
run = "cargo fmt --check"

# These commands share Cargo's target directory. Forkstr runs them in registration
# order instead of launching processes that block on the same build lock.
[[stages.commands]]
name = "clippy"
run = "cargo clippy --locked --all-targets -- -D warnings"
resources = ["cargo-target"]

[[stages.commands]]
name = "tests"
run = "cargo nextest run --locked"
resources = ["cargo-target"]

[[stages.commands]]
name = "release"
run = "cargo build --locked --release"
resources = ["cargo-target"]
