version = 1

[[stages]]
name = "quality"
commands = [
  { name = "format", run = "npm run format:check" },
  { name = "lint",   run = "npm run lint" },
  { name = "tests",  run = "npm test" },
  { name = "audit",  run = "npm audit" },
]

[[stages]]
name = "package"
commands = [
  { name = "release", run = "npm run build" },
]
