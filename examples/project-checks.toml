# Run Forkstr's own checks from the project root, not the examples directory.
version = 1
cwd = ".."
failure = "fail-fast"

[[stages]]
name = "checks"
# No jobs limit: all three commands start concurrently.

[[stages.commands]]
name = "format"
run = "cargo fmt --check"

[[stages.commands]]
name = "clippy"
run = "cargo clippy --locked --all-targets -- -D warnings"

[[stages.commands]]
name = "nextest"
run = "cargo nextest run --locked"
