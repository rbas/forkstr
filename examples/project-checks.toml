# Run Forkstr's own checks from the project root, not the examples directory.
version = 1
cwd = ".."
failure = "fail-fast"

[[stages]]
name = "checks"
# No jobs limit: all three commands start concurrently.
commands = [
  { name = "format", run = "cargo fmt --check" },
  { name = "clippy", run = "cargo clippy --locked --all-targets -- -D warnings" },
  { name = "nextest", run = "cargo nextest run --locked" },
]
